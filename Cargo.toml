[package]
name = "aurora-lights"
version = "0.1.0"
edition = "2024"
description = "Chassis RGB lighting control for the Alienware Aurora R16 on Linux and Windows"
readme = "README.md"

[dependencies]
eframe = "0.37.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.191"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Devices_HumanInterfaceDevice", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_Security", "Win32_System_Registry"] }

[profile.release]
strip = true
