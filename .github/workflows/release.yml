# Builds standalone Linux and Windows binaries. Pushing a tag such as v0.1.0
# publishes them on a GitHub release; a manual run only uploads them as
# workflow artifacts.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported runner keeps the glibc requirement low.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: aurora-lights
            asset: aurora-lights-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: aurora-lights.exe
            asset: aurora-lights-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            aurora-lights-linux-x86_64
            aurora-lights-windows-x86_64.exe
          generate_release_notes: true
